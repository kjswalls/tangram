<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Tangram</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: #fbfaf7;
        color: #1c1917;
        font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 28rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1rem; color: #57534e; }
      ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem; }
      a {
        display: inline-block;
        padding: 0.4rem 0.75rem;
        border: 1px solid #d6d3d1;
        border-radius: 0.5rem;
        color: #0f766e;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #12110f; color: #f5f5f4; }
        p { color: #a8a29e; }
        a { border-color: #3f3f46; color: #5eead4; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This page was never cached, so there is nothing to show for it. Review still works —
        your cards live in this browser.
      </p>
      <ul>
        <li><a href="/review">Review</a></li>
        <li><a href="/">Today</a></li>
        <li><a href="/lists">Lists</a></li>
        <li><a href="/settings">Settings</a></li>
      </ul>
    </main>
  </body>
</html>
